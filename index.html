<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armoniche BT – Dimensionamento sbarratura</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="login" class="login">
  <form id="loginform" class="logbox" autocomplete="off">
    <h1>Armoniche BT</h1>
    <p>Dimensionamento armoniche su sbarratura quadro 400 V</p>
    <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Accedi</button>
    <p id="loginmsg" class="muted" role="status"></p>
  </form>
</main>

<div id="app" hidden>
  <header class="top no-print">
    <div class="brand"><b>Armoniche BT</b><small>sbarratura quadro 400 V · inverter</small></div>
    <div class="topbtns">
      <button data-top="new">Nuovo</button><button data-top="open">Apri</button><button data-top="save">Salva file</button><button data-top="logout">Esci</button>
    </div>
  </header>
  <nav id="nav" class="nav no-print"></nav>
  <div id="page" class="page"></div>
  <div id="toast" class="toast" role="status"></div>
</div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/calc.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
